{% extends "./../blocks/layout.html" %}

{% block container %}
    <div class="content-wrapper">
        <!-- Content Header (Page header) -->
        <section class="content-header">
            <h1>
              會員管理列表介面
            </h1>
            <ol class="breadcrumb">
                <li><a href="#"><i class="fa fa-dashboard"></i> 會員管理</a></li>
                <li class="active">會員管理列表</li>
            </ol>
        </section>

        <!-- Main content -->
        <section class="content">

            <section class="content">
                <div class="row">
                    <div class="col-xs-12">
                        <div class="box">
                            <div class="box-header">
                                <h3 class="box-title">會員管理列表</h3>
                            </div>
                            <!-- /.box-header -->
                            <div class="box-body">
                                <table id="main-list" class="table table-bordered table-hover">
                                    <thead>
                                        <th>編號</th>
                                        <th>姓名</th>
                                        <th>Email</th>
                                        <th>編輯</th>
                                        <th>刪除</th>
                                    </thead>
                                    <tbody>
                                        {% for user in users %}
                                            <tr>
                                                <td>{{ user.sn }}</td>
                                                <td>{{ user.name }}</td>
                                                <td>{{ user.email }}</td>
                                                <td>
                                                    <a href="/admin/user/update/{{ user.sn }}" class="btn btn-flat btn-info">
                                                        <i class="fa fa-edit"></i> Edit
                                                      </a>
                                                </td>
                                                <td>
                                                    <a class="btn btn-flat btn-danger">
                                                        <i class="fa fa-trash"></i> Del
                                                      </a>
                                                </td>
                                            </tr>
                                        {% endfor %}
                                    </tbody>
                                </table>
                                <div class="text-right">
                                    <a href='/admin/user/create' class="btn btn-primary btn-lg">
                                        <i class="fa fa-plus"></i> 新增一筆
                                    </a>
                                </div>
                            </div>
                            <!-- /.box-body -->
                        </div>
                        <!-- /.box -->

                    </div>
                    <!-- /.col -->
                </div>
                <!-- /.row -->
            </section>
            <!-- /.content -->
        </section>
        <!-- /.content -->
    </div>

{% endblock %}
{% block jsBlock %}
    <link rel="stylesheet" href="https://cdn.datatables.net/1.10.12/css/dataTables.bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/skins/_all-skins.min.css">
    <script src="https://cdn.datatables.net/1.10.12/js/jquery.dataTables.js"></script>
    <script src="https://cdn.datatables.net/1.10.12/js/dataTables.bootstrap.min.js"></script>
    <script>
        $(function() {
            $('#main-list').DataTable({
                paging: true,
                lengthChange: true,
                searching: true,
                ordering: true,
                info: true,
                autoWidth: true,
                language: {
                    search: '搜尋: ',
                    zeroRecords: '搜尋不到任何項目 :(',
                    infoEmpty: '沒有任何項目',
                    infoFiltered: '( 搜尋 _MAX_ 條項目 )',
                    info: "顯示 _START_ 至 _END_ 項，總數為 _TOTAL_ 項",
                    sLengthMenu: "顯示 _MENU_ 筆",
                    paginate: {
                        previous: '上一頁',
                        next: '下一頁',
                        last: '最後一頁',
                        first: '第一頁'
                    }
                }
            });
        });
    </script>
{% endblock %}
