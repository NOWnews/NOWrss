<form action="{{ pathname }}" method="GET">
    <div class="form-group box-body text-center">
        <div class="input-group" style="width: 300px; margin: auto;">
            <input id="time" name="time" value="{{ time }}" type="text" class="form-control input">
            <label for="timer" class="input-group-addon" style="padding: 0;">
                <button type="submit" class="btn bg-olive" style="padding: 5px 9px;">送出</button>
            </label>
        </div>
    </div>
</form>
